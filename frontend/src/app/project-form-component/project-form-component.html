<div class="auth-page">
  <div class="terminal-card">

    <div class="terminal-card__titlebar">
      <span class="dot dot--red" aria-hidden="true"></span>
      <span class="dot dot--amber" aria-hidden="true"></span>
      <span class="dot dot--green" aria-hidden="true"></span>
      <span class="terminal-card__filename">new-project.sh</span>
    </div>

    <form class="terminal-card__body" [formGroup]="createProjectForm" (ngSubmit)="onSubmit()" novalidate>

      <div class="terminal-card__prompt">
        <span class="prompt-symbol">$</span> ./new-project.sh
      </div>

      <div class="form-group">
        <label for="name">name</label>
        <input
          id="name"
          type="text"
          formControlName="name"
          placeholder="my-awesome-project"
          [attr.aria-invalid]="createProjectForm.get('name')?.invalid && createProjectForm.get('name')?.touched"
        >
      </div>

      <div class="form-group">
        <label for="description">description</label>
        <input
          id="description"
          type="text"
          formControlName="description"
          placeholder="Optional"
          [attr.aria-invalid]="createProjectForm.get('description')?.invalid && createProjectForm.get('description')?.touched"
        >
      </div>

      <button class="btn btn--primary" type="submit" [disabled]="createProjectForm.invalid">
        Create project
      </button>
      <button type="button" class="btn btn--secondary" (click)="onCancel()">
          Cancel
      </button>

      @if (errorMessage()) {
        <p class="form-error" role="alert">{{ errorMessage() }}</p>
      }

    </form>
  </div>
</div>
