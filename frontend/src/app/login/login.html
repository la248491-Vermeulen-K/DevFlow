<div class="auth-page">
  <div class="terminal-card">

    <div class="terminal-card__titlebar">
      <span class="dot dot--red" aria-hidden="true"></span>
      <span class="dot dot--amber" aria-hidden="true"></span>
      <span class="dot dot--green" aria-hidden="true"></span>
      <span class="terminal-card__filename">sign-in.sh</span>
    </div>

    <form class="terminal-card__body" [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      
      <div class="terminal-card__prompt">
        <span class="prompt-symbol">$</span> ./sign-in.sh
      </div>

      <div class="form-group">
        <label for="email">email</label>
        <input 
          id="email" 
          type="email" 
          formControlName="email" 
          placeholder="you@example.com"
          autocomplete="email"
          [attr.aria-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        >
      </div>

      <div class="form-group">
        <label for="password">password</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password" 
          placeholder="••••••••"
          autocomplete="current-password"
          [attr.aria-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        >
      </div>

      <button class="btn btn--primary" type="submit" [disabled]="loginForm.invalid">
        Login
      </button>

      @if (errorMessage()) {
        <p class="form-error" role="alert">{{ errorMessage() }}</p>
      }

    </form>
  </div>
</div>
