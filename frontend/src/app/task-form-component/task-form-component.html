<div class="auth-page auth-page--embedded">
  <div class="terminal-card">

    <div class="terminal-card__titlebar">
      <span class="dot dot--red" aria-hidden="true"></span>
      <span class="dot dot--amber" aria-hidden="true"></span>
      <span class="dot dot--green" aria-hidden="true"></span>
      <span class="terminal-card__filename">new-task.sh</span>
    </div>

    <form class="terminal-card__body" [formGroup]="taskForm" (ngSubmit)="onSubmit()" novalidate>

      <div class="terminal-card__prompt">
        <span class="prompt-symbol">$</span> ./new-task.sh
      </div>

      <div class="form-group">
        <label for="title">title</label>
        <input
          id="title"
          type="text"
          formControlName="title"
          placeholder="Corriger le bug de login"
          [attr.aria-invalid]="taskForm.get('title')?.invalid && taskForm.get('title')?.touched"
        >
      </div>

      <div class="form-group">
        <label for="description">description</label>
        <input
          id="description"
          type="text"
          formControlName="description"
          placeholder="Optionnel"
        >
      </div>

      <div class="form-group">
        <label for="priority">Priority</label>
        <select id="priority" formControlName="priority">
          <option value="LOW">LOW</option>
          <option value="MEDIUM">MEDIUM</option>
          <option value="HIGH">HIGH</option>
        </select>
      </div>

      <div class="terminal-card__actions">
        <button type="button" class="btn btn--secondary" (click)="onCancel()">
          Annuler
        </button>
        <button type="submit" class="btn btn--primary" [disabled]="taskForm.invalid">
          Créer la tâche
        </button>
      </div>

      @if (errorMessage()) {
        <p class="form-error" role="alert">{{ errorMessage() }}</p>
      }

    </form>
  </div>
</div>
